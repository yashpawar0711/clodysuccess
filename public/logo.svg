<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56" fill="none">
  <defs>
    <!-- Core 5D Brand Gradients -->
    <linearGradient id="csCyanBlueGrad" x1="4" y1="4" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="csCoreGlow" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="csCircuitGrad" x1="16" y1="16" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="csNeonFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="csAmbientGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.5" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Orbit Energy Ring 1 -->
  <circle cx="28" cy="28" r="25" stroke="url(#csCoreGlow)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.85"/>
  
  <!-- Outer Orbit Energy Ring 2 (Counter-accents) -->
  <circle cx="28" cy="28" r="22.5" stroke="#00f0ff" stroke-width="0.8" stroke-dasharray="32 18 12 18" opacity="0.6"/>

  <!-- Orbiting Quantum Dots -->
  <circle cx="28" cy="3" r="1.8" fill="#00f0ff" filter="url(#csNeonFilter)"/>
  <circle cx="53" cy="28" r="1.5" fill="#8b5cf6" filter="url(#csNeonFilter)"/>
  <circle cx="28" cy="53" r="1.5" fill="#38bdf8" filter="url(#csNeonFilter)"/>
  <circle cx="3" cy="28" r="1.2" fill="#22d3ee"/>

  <!-- Futuristic Cloud Chassis (Preserved & Enhanced CS Signature) -->
  <path d="M17 39H38.5C43.7467 39 48 34.7467 48 29.5C48 24.5577 44.2346 20.4939 39.4124 20.0456C38.4598 13.9198 33.1706 9.3 26.79 9.3C21.1852 9.3 16.4272 12.8824 14.7214 17.9628C10.0772 19.0474 6.44 23.2309 6.44 28.3C6.44 34.2094 11.2306 39 17 39Z" 
        fill="url(#csCyanBlueGrad)" 
        filter="url(#csNeonFilter)"/>
        
  <!-- Digital Core Arrow / Bolt / Circuit (CS Dynamic Core) -->
  <path d="M24 32L32 23M32 23H25M32 23V30" stroke="url(#csCircuitGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Core Luminary Point -->
  <circle cx="23" cy="33" r="2.2" fill="#ffffff" filter="url(#csNeonFilter)"/>
  <circle cx="32" cy="23" r="1.5" fill="#00f0ff"/>
</svg>
